{% extends "base.html" %}
{% block title %}Motor de sustitutos{% endblock %}
{% block content %}
<section class="card">
  <h1>Recomendador de Sustitutos Totto</h1>
  <p>Ingresa el <strong>CODIGO PLM SKU</strong> del producto a sustituir.</p>
  <form action="/recommend" method="post">
    <label for="sku">SKU</label>
    <input type="text" id="sku" name="sku" required>
    <label for="top_k">Top K</label>
    <input type="number" id="top_k" name="top_k" value="3" min="1" max="10">
    <button type="submit">Buscar sustitutos</button>
  </form>
</section>
{% endblock %}
